[package]
name = "tide"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["protocol-asset"] }
# "tracing-subscriber-utils" is required: librqbit 9.0.1 with only "http-api" fails to
# compile (E0599 api_log_lines_stream). With it, Api::new takes 3 args.
librqbit = { version = "=9.0.1", features = ["http-api", "tracing-subscriber-utils"] }
librqbit-dualstack-sockets = "0.7"
# SHA-256 for archive moves (CommonCrypto via crypto-hash; already built for librqbit).
librqbit-sha1-wrapper = "=9.0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
urlencoding = "2"
# Metadata (Cinemeta). Same reqwest/rustls stack librqbit already compiles: no second TLS stack.
reqwest = { version = "0.13", default-features = false, features = ["default-tls"] }
regex = "1"
# IMDb title.ratings.tsv.gz fallback (already in the tree via librqbit).
flate2 = "1"
strsim = "0.11"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"

[profile.dev.package."*"]
opt-level = 2
