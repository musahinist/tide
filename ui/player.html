<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Player</title>
  <link rel="stylesheet" href="player.css">
</head>
<body>
  <main id="stage">
    <video id="video" controls autoplay playsinline preload="auto" x-webkit-airplay="allow"></video>

    <section id="audio-view" hidden>
      <div class="poster">
        <svg viewBox="0 0 24 24" width="56" height="56" aria-hidden="true">
          <path fill="currentColor" d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/>
        </svg>
        <div id="audio-title"></div>
      </div>
      <audio id="audio" controls autoplay preload="auto"></audio>
    </section>

    <div id="spinner" hidden></div>
    <div id="osd" aria-live="polite"></div>

    <div id="hud">
      <select id="subs" title="Subtitles" hidden></select>
      <button id="airplay" type="button" title="AirPlay" aria-label="AirPlay" hidden>
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" d="M6 17H4.5A1.5 1.5 0 0 1 3 15.5v-9A1.5 1.5 0 0 1 4.5 5h15A1.5 1.5 0 0 1 21 6.5v9a1.5 1.5 0 0 1-1.5 1.5H18"/><path fill="currentColor" d="M12 14l5 6H7z"/></svg>
      </button>
      <button id="next-btn" type="button" title="Next episode (N)" aria-label="Next episode" hidden>&#x23ED;&#xFE0E;</button>
      <button id="vlc" type="button" title="Open in VLC">Open in VLC</button>
    </div>

    <div id="next" hidden>
      <span class="next-text">Next: <b id="next-label"></b><span id="next-count"></span></span>
      <button id="next-play" type="button">Play now</button>
      <button id="next-cancel" type="button">Cancel</button>
    </div>

    <div id="msg" hidden>
      <div class="box">
        <p id="msg-text"></p>
        <div class="actions">
          <button id="msg-get-vlc" type="button" hidden>Get VLC</button>
          <button id="msg-vlc" type="button" hidden>Open in VLC</button>
        </div>
      </div>
    </div>
  </main>
  <script src="player.js"></script>
</body>
</html>
